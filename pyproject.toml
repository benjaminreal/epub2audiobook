[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epub2audiobook"
version = "0.1.0"
description = "Convert ePub files to M4B audiobooks with chapter markers using local Kokoro TTS"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "piper-tts>=1.4.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "pydub>=0.25",
    "mutagen>=1.47",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
mlx = [
    "mlx-audio==0.5.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "misaki[en]==0.9.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
