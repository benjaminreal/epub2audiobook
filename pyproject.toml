[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epub2audiobook"
version = "0.1.0"
description = "Convert ePub files to M4B audiobooks with chapter markers using Piper TTS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "piper-tts>=1.4.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "pydub>=0.25",
    "mutagen>=1.47",
    "kokoro-onnx>=0.6.1",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
